[project]
name = "metalpartidbetification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.12.0",
]

[project.scripts]
metalpartidbetification = "metalpartidbetification:main"

[build-system]
